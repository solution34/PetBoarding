<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="1050" viewBox="0 0 1260 1050"><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#334155" stroke-width="1.4"/></marker><marker id="tri" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M1 1L11 6L1 11Z" fill="white" stroke="#334155"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="32" y="35" font-size="23" font-weight="bold" font-family="Microsoft YaHei, sans-serif">顺序图 审核分房</text><rect x="35" y="70" width="210" height="55" rx="0" fill="#f1f5f9" stroke="#334155" stroke-width="1.4"/><text x="140.0" y="102.5" text-anchor="middle" font-size="16" font-family="Microsoft YaHei, sans-serif">工作人员</text><text x="140.5" y="935.5" text-anchor="middle" font-size="15" font-family="Microsoft YaHei, sans-serif"></text><rect x="345" y="70" width="210" height="55" rx="0" fill="#f1f5f9" stroke="#334155" stroke-width="1.4"/><text x="450.0" y="102.5" text-anchor="middle" font-size="16" font-family="Microsoft YaHei, sans-serif">审核页面</text><text x="450.5" y="935.5" text-anchor="middle" font-size="15" font-family="Microsoft YaHei, sans-serif"></text><rect x="655" y="70" width="210" height="55" rx="0" fill="#f1f5f9" stroke="#334155" stroke-width="1.4"/><text x="760.0" y="102.5" text-anchor="middle" font-size="16" font-family="Microsoft YaHei, sans-serif">预约服务</text><text x="760.5" y="935.5" text-anchor="middle" font-size="15" font-family="Microsoft YaHei, sans-serif"></text><rect x="965" y="70" width="210" height="55" rx="0" fill="#f1f5f9" stroke="#334155" stroke-width="1.4"/><text x="1070.0" y="102.5" text-anchor="middle" font-size="16" font-family="Microsoft YaHei, sans-serif">业务存储</text><text x="1070.5" y="935.5" text-anchor="middle" font-size="15" font-family="Microsoft YaHei, sans-serif"></text><text x="640.0" y="987.0" text-anchor="middle" font-size="15" font-family="Microsoft YaHei, sans-serif">事务内任何校验失败均回滚，预约保持待审核。</text><text x="640.0" y="1008.0" text-anchor="middle" font-size="15" font-family="Microsoft YaHei, sans-serif">消息6至8仅在无冲突时执行；驳回是另一条操作，必须填写原因。</text><polyline points="140,125 140,930" fill="none" stroke="#334155" stroke-width="1.35" stroke-dasharray="6 5" /><polyline points="450,125 450,930" fill="none" stroke="#334155" stroke-width="1.35" stroke-dasharray="6 5" /><polyline points="760,125 760,930" fill="none" stroke="#334155" stroke-width="1.35" stroke-dasharray="6 5" /><polyline points="1070,125 1070,930" fill="none" stroke="#334155" stroke-width="1.35" stroke-dasharray="6 5" /><polyline points="140,170 450,170" fill="none" stroke="#334155" stroke-width="1.35"  marker-end="url(#arr)"/><rect x="223.5" y="151.0" width="143" height="19" fill="white"/><text x="295.0" y="166.0" text-anchor="middle" font-size="13" font-family="Microsoft YaHei, sans-serif">1 选择预约和具体房间</text><polyline points="450,231 760,231" fill="none" stroke="#334155" stroke-width="1.35"  marker-end="url(#arr)"/><rect x="520.5" y="212.0" width="169" height="19" fill="white"/><text x="605.0" y="227.0" text-anchor="middle" font-size="13" font-family="Microsoft YaHei, sans-serif">2 提交审核通过及确认价格</text><polyline points="760,292 1070,292" fill="none" stroke="#334155" stroke-width="1.35"  marker-end="url(#arr)"/><rect x="830.5" y="273.0" width="169" height="19" fill="white"/><text x="915.0" y="288.0" text-anchor="middle" font-size="13" font-family="Microsoft YaHei, sans-serif">3 开始事务并锁定相关资源</text><polyline points="760,353 1070,353" fill="none" stroke="#334155" stroke-width="1.35"  marker-end="url(#arr)"/><rect x="824.0" y="334.0" width="182" height="19" fill="white"/><text x="915.0" y="349.0" text-anchor="middle" font-size="13" font-family="Microsoft YaHei, sans-serif">4 重检待审核及房间日期冲突</text><polyline points="1070,414 760,414" fill="none" stroke="#334155" stroke-width="1.35" stroke-dasharray="6 5" marker-end="url(#arr)"/><rect x="843.5" y="395.0" width="143" height="19" fill="white"/><text x="915.0" y="410.0" text-anchor="middle" font-size="13" font-family="Microsoft YaHei, sans-serif">5 返回匹配和冲突结果</text><polyline points="760,475 1070,475" fill="none" stroke="#334155" stroke-width="1.35"  marker-end="url(#arr)"/><rect x="817.5" y="456.0" width="195" height="19" fill="white"/><text x="915.0" y="471.0" text-anchor="middle" font-size="13" font-family="Microsoft YaHei, sans-serif">6 无冲突时保存房间和价格快照</text><polyline points="760,536 1070,536" fill="none" stroke="#334155" stroke-width="1.35"  marker-end="url(#arr)"/><rect x="837.0" y="517.0" width="156" height="19" fill="white"/><text x="915.0" y="532.0" text-anchor="middle" font-size="13" font-family="Microsoft YaHei, sans-serif">7 更新已确认并提交事务</text><polyline points="1070,597 760,597" fill="none" stroke="#334155" stroke-width="1.35" stroke-dasharray="6 5" marker-end="url(#arr)"/><rect x="863.0" y="578.0" width="104" height="19" fill="white"/><text x="915.0" y="593.0" text-anchor="middle" font-size="13" font-family="Microsoft YaHei, sans-serif">8 确认提交成功</text><polyline points="760,658 1070,658" fill="none" stroke="#334155" stroke-width="1.35"  marker-end="url(#arr)"/><rect x="843.5" y="639.0" width="143" height="19" fill="white"/><text x="915.0" y="654.0" text-anchor="middle" font-size="13" font-family="Microsoft YaHei, sans-serif">9 登记审核通知待发送</text><polyline points="760,719 450,719" fill="none" stroke="#334155" stroke-width="1.35" stroke-dasharray="6 5" marker-end="url(#arr)"/><rect x="546.5" y="700.0" width="117" height="19" fill="white"/><text x="605.0" y="715.0" text-anchor="middle" font-size="13" font-family="Microsoft YaHei, sans-serif">10 返回审核结果</text></svg>
