<svg xmlns="http://www.w3.org/2000/svg" width="1190" height="1710" viewBox="0 0 1190 1710"><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#334155" stroke-width="1.4"/></marker><marker id="tri" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M1 1L11 6L1 11Z" fill="white" stroke="#334155"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="32" y="35" font-size="23" font-weight="bold" font-family="Microsoft YaHei, sans-serif">活动图 预约到离店的业务流程</text><circle cx="580.0" cy="84.0" r="14.0" fill="#334155"/><rect x="460" y="125" width="240" height="50" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.4"/><text x="580.0" y="155.0" text-anchor="middle" font-size="14" font-family="Microsoft YaHei, sans-serif">主人提交预约</text><rect x="460" y="220" width="240" height="55" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.4"/><text x="580.0" y="252.5" text-anchor="middle" font-size="14" font-family="Microsoft YaHei, sans-serif">工作人员审核并分房</text><polygon points="580.0,320 665,365.0 580.0,410 495,365.0" fill="#ffffff" stroke="#334155" stroke-width="1.4"/><text x="580.0" y="370.0" text-anchor="middle" font-size="14" font-family="Microsoft YaHei, sans-serif">审核通过</text><rect x="100" y="340" width="230" height="55" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.4"/><text x="215.0" y="372.5" text-anchor="middle" font-size="14" font-family="Microsoft YaHei, sans-serif">驳回并通知主人</text><rect x="460" y="460" width="240" height="55" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.4"/><text x="580.0" y="492.5" text-anchor="middle" font-size="14" font-family="Microsoft YaHei, sans-serif">已确认并预留房间</text><rect x="460" y="555" width="240" height="50" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.4"/><text x="580.0" y="585.0" text-anchor="middle" font-size="14" font-family="Microsoft YaHei, sans-serif">主人按计划到店</text><rect x="855" y="470" width="240" height="70" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.4"/><text x="975.0" y="500.0" text-anchor="middle" font-size="14" font-family="Microsoft YaHei, sans-serif">取消或到期未到店</text><text x="975.0" y="520.0" text-anchor="middle" font-size="14" font-family="Microsoft YaHei, sans-serif">释放计划占用</text><polygon points="580.0,660 710,712.5 580.0,765 450,712.5" fill="#ffffff" stroke="#334155" stroke-width="1.4"/><text x="580.0" y="717.5" text-anchor="middle" font-size="14" font-family="Microsoft YaHei, sans-serif">资料通过且房间空闲</text><rect x="855" y="680" width="250" height="70" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.4"/><text x="980.0" y="710.0" text-anchor="middle" font-size="14" font-family="Microsoft YaHei, sans-serif">说明失败原因</text><text x="980.0" y="730.0" text-anchor="middle" font-size="14" font-family="Microsoft YaHei, sans-serif">人工协调或取消原单</text><rect x="440" y="815" width="280" height="60" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.4"/><text x="580.0" y="850.0" text-anchor="middle" font-size="14" font-family="Microsoft YaHei, sans-serif">办理入住并制定照护计划</text><rect x="440" y="930" width="280" height="70" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.4"/><text x="580.0" y="960.0" text-anchor="middle" font-size="14" font-family="Microsoft YaHei, sans-serif">执行照护并登记</text><text x="580.0" y="980.0" text-anchor="middle" font-size="14" font-family="Microsoft YaHei, sans-serif">未完成超时则去重提醒</text><rect x="460" y="1050" width="240" height="55" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.4"/><text x="580.0" y="1082.5" text-anchor="middle" font-size="14" font-family="Microsoft YaHei, sans-serif">主人申请接回宠物</text><rect x="440" y="1155" width="280" height="60" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.4"/><text x="580.0" y="1190.0" text-anchor="middle" font-size="14" font-family="Microsoft YaHei, sans-serif">计算账单并由主人核对</text><polygon points="580.0,1275 675,1320.0 580.0,1365 485,1320.0" fill="#ffffff" stroke="#334155" stroke-width="1.4"/><text x="580.0" y="1325.0" text-anchor="middle" font-size="14" font-family="Microsoft YaHei, sans-serif">确认全额收款</text><rect x="855" y="1285" width="270" height="75" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.4"/><text x="990.0" y="1317.5" text-anchor="middle" font-size="14" font-family="Microsoft YaHei, sans-serif">处理账单异议或等待收款</text><text x="990.0" y="1337.5" text-anchor="middle" font-size="14" font-family="Microsoft YaHei, sans-serif">保持在住与房间实际占用</text><rect x="440" y="1430" width="280" height="70" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.4"/><text x="580.0" y="1460.0" text-anchor="middle" font-size="14" font-family="Microsoft YaHei, sans-serif">原子登记收款并结单</text><text x="580.0" y="1480.0" text-anchor="middle" font-size="14" font-family="Microsoft YaHei, sans-serif">释放实际占用</text><circle cx="580.0" cy="1587.0" r="17.0" fill="white" stroke="#334155" stroke-width="2"/><circle cx="580.0" cy="1587.0" r="12.0" fill="#334155"/><text x="565.0" y="1662.5" text-anchor="middle" font-size="14" font-family="Microsoft YaHei, sans-serif">检查失败不会生成入住；人工重新安排需取消并重建预约。</text><text x="565.0" y="1682.5" text-anchor="middle" font-size="14" font-family="Microsoft YaHei, sans-serif">本图展示业务控制流，不虚构并行；站内通知可在业务成功后重试。</text><polyline points="580.0,98.0 580.0,125.0" fill="none" stroke="#334155" stroke-width="1.35"  marker-end="url(#arr)"/><polyline points="580.0,175.0 580.0,220.0" fill="none" stroke="#334155" stroke-width="1.35"  marker-end="url(#arr)"/><polyline points="580.0,275.0 580.0,320.0" fill="none" stroke="#334155" stroke-width="1.35"  marker-end="url(#arr)"/><polyline points="580.0,410.0 580.0,460.0" fill="none" stroke="#334155" stroke-width="1.35"  marker-end="url(#arr)"/><rect x="560.0" y="416.0" width="40" height="19" fill="white"/><text x="580.0" y="431.0" text-anchor="middle" font-size="13" font-family="Microsoft YaHei, sans-serif">是</text><polyline points="495.0,365.5821917808219 330.0,366.71232876712327" fill="none" stroke="#334155" stroke-width="1.35"  marker-end="url(#arr)"/><rect x="392.5" y="347.1472602739726" width="40" height="19" fill="white"/><text x="412.5" y="362.1472602739726" text-anchor="middle" font-size="13" font-family="Microsoft YaHei, sans-serif">否</text><polyline points="580.0,515.0 580.0,555.0" fill="none" stroke="#334155" stroke-width="1.35"  marker-end="url(#arr)"/><rect x="554.0" y="516.0" width="52" height="19" fill="white"/><text x="580.0" y="531.0" text-anchor="middle" font-size="13" font-family="Microsoft YaHei, sans-serif">如期到店</text><polyline points="700.0,492.8164556962025 855.0,499.6835443037975" fill="none" stroke="#334155" stroke-width="1.35"  marker-end="url(#arr)"/><rect x="745.0" y="477.25" width="65" height="19" fill="white"/><text x="777.5" y="492.25" text-anchor="middle" font-size="13" font-family="Microsoft YaHei, sans-serif">取消或失约</text><polyline points="580.0,605.0 580.0,660.0" fill="none" stroke="#334155" stroke-width="1.35"  marker-end="url(#arr)"/><polyline points="580.0,765.0 580.0,815.0" fill="none" stroke="#334155" stroke-width="1.35"  marker-end="url(#arr)"/><rect x="560.0" y="771.0" width="40" height="19" fill="white"/><text x="580.0" y="786.0" text-anchor="middle" font-size="13" font-family="Microsoft YaHei, sans-serif">是</text><polyline points="710.0,713.3125 855.0,714.21875" fill="none" stroke="#334155" stroke-width="1.35"  marker-end="url(#arr)"/><rect x="762.5" y="694.765625" width="40" height="19" fill="white"/><text x="782.5" y="709.765625" text-anchor="middle" font-size="13" font-family="Microsoft YaHei, sans-serif">否</text><polyline points="580.0,875.0 580.0,930.0" fill="none" stroke="#334155" stroke-width="1.35"  marker-end="url(#arr)"/><polyline points="580.0,1000.0 580.0,1050.0" fill="none" stroke="#334155" stroke-width="1.35"  marker-end="url(#arr)"/><rect x="560.0" y="1006.0" width="40" height="19" fill="white"/><text x="580.0" y="1021.0" text-anchor="middle" font-size="13" font-family="Microsoft YaHei, sans-serif">接回时</text><polyline points="580.0,1105.0 580.0,1155.0" fill="none" stroke="#334155" stroke-width="1.35"  marker-end="url(#arr)"/><polyline points="580.0,1215.0 580.0,1275.0" fill="none" stroke="#334155" stroke-width="1.35"  marker-end="url(#arr)"/><polyline points="580.0,1365.0 580.0,1430.0" fill="none" stroke="#334155" stroke-width="1.35"  marker-end="url(#arr)"/><rect x="560.0" y="1378.5" width="40" height="19" fill="white"/><text x="580.0" y="1393.5" text-anchor="middle" font-size="13" font-family="Microsoft YaHei, sans-serif">是</text><polyline points="675.0,1320.5792682926829 855.0,1321.6768292682927" fill="none" stroke="#334155" stroke-width="1.35"  marker-end="url(#arr)"/><rect x="745.0" y="1302.128048780488" width="40" height="19" fill="white"/><text x="765.0" y="1317.128048780488" text-anchor="middle" font-size="13" font-family="Microsoft YaHei, sans-serif">否</text><polyline points="580.0,1500.0 580.0,1570.0" fill="none" stroke="#334155" stroke-width="1.35"  marker-end="url(#arr)"/><polyline points="440,970 350,970 350,910 580,910 580,930" fill="none" stroke="#334155" stroke-width="1.35"  marker-end="url(#arr)"/><rect x="324.0" y="921.0" width="52" height="19" fill="white"/><text x="350.0" y="936.0" text-anchor="middle" font-size="13" font-family="Microsoft YaHei, sans-serif">继续寄养</text><polyline points="990,1285 990,1185 720,1185" fill="none" stroke="#334155" stroke-width="1.35"  marker-end="url(#arr)"/><rect x="964.0" y="1216.0" width="52" height="19" fill="white"/><text x="990.0" y="1231.0" text-anchor="middle" font-size="13" font-family="Microsoft YaHei, sans-serif">重新核对</text><polyline points="215,395 215,1587 563,1587" fill="none" stroke="#334155" stroke-width="1.35"  marker-end="url(#arr)"/><polyline points="1095,505 1150,505 1150,1640 580,1640 580,1604" fill="none" stroke="#334155" stroke-width="1.35"  marker-end="url(#arr)"/><polyline points="980,680 980,540" fill="none" stroke="#334155" stroke-width="1.35"  marker-end="url(#arr)"/><rect x="9