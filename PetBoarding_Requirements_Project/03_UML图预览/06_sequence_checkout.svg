white"/><text x="605.0" y="410.0" text-anchor="middle" font-size="13" font-family="Microsoft YaHei, sans-serif">5 返回基本费 逾期费及附加费</text><polyline points="450,475 140,475" fill="none" stroke="#334155" stroke-width="1.35" stroke-dasharray="6 5" marker-end="url(#arr)"/><rect x="223.5" y="456.0" width="143" height="19" fill="white"/><text x="295.0" y="471.0" text-anchor="middle" font-size="13" font-family="Microsoft YaHei, sans-serif">6 展示账单供主人核对</text><polyline points="140,536 450,536" fill="none" stroke="#334155" stroke-width="1.35"  marker-end="url(#arr)"/><rect x="197.5" y="517.0" width="195" height="19" fill="white"/><text x="295.0" y="532.0" text-anchor="middle" font-size="13" font-family="Microsoft YaHei, sans-serif">7 主人核对后确认线下全额收款</text><polyline points="450,597 760,597" fill="none" stroke="#334155" stroke-width="1.35"  marker-end="url(#arr)"/><rect x="501.0" y="578.0" width="208" height="19" fill="white"/><text x="605.0" y="593.0" text-anchor="middle" font-size="13" font-family="Microsoft YaHei, sans-serif">8 提交结单 requestId</text><polyline points="760,658 1070,658" fill="none" stroke="#334155" stroke-width="1.35"  marker-end="url(#arr)"/><rect x="811.0" y="639.0" width="208" height="19" fill="white"/><text x="915.0" y="654.0" text-anchor="middle" font-size="13" font-family="Microsoft YaHei, sans-serif">9 事务重检状态 金额及重复请求</text><polyline points="760,719 1070,719" fill="none" stroke="#334155" stroke-width="1.35"  marker-end="url(#arr)"/><rect x="798.0" y="700.0" width="234" height="19" fill="white"/><text x="915.0" y="715.0" text-anchor="middle" font-size="13" font-family="Microsoft YaHei, sans-serif">10 保存收款 关闭入住 更新已完成</text><polyline points="1070,780 760,780" fill="none" stroke="#334155" stroke-width="1.35" stroke-dasharray="6 5" marker-end="url(#arr)"/><rect x="824.0" y="761.0" width="182" height="19" fill="white"/><text x="915.0" y="776.0" text-anchor="middle" font-size="13" font-family="Microsoft YaHei, sans-serif">11 提交成功并释放实际占用</text><polyline points="760,841