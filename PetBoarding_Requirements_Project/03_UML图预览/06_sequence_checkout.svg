<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="1050" viewBox="0 0 1260 1050"><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#334155" stroke-width="1.4"/></marker><marker id="tri" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M1 1L11 6L1 11Z" fill="white" stroke="#334155"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="32" y="35" font-size="23" font-weight="bold" font-family="Microsoft YaHei, sans-serif">顺序图 离店结算</text><rect x="35" y="70" width="210" height="55" rx="0" fill="#f1f5f9" stroke="#334155" stroke-width="1.4"/><text x="140.0" y="102.5" text-anchor="middle" font-size="16" font-family="Microsoft YaHei, sans-serif">工作人员</text><text x="140.5" y="935.5" text-anchor="middle" font-size="15" font-family="Microsoft YaHei, sans-serif"></text><rect x="345" y="70" width="210" height="55" rx="0" fill="#f1f5f9" stroke="#334155" stroke-width="1.4"/><text x="450.0" y="102.5" text-anchor="middle" font-size="16" font-family="Microsoft YaHei, sans-serif">结算页面</text><text x="450.5" y="935.5" text-anchor="middle" font-size="15" font-family="Microsoft YaHei, sans-serif"></text><rect x="655" y="70" width="210" height="55" rx="0" fill="#f1f5f9" stroke="#334155" stroke-width="1.4"/><text x="760.0" y="102.5" text-anchor="middle" font-size="16" font-family="Microsoft YaHei, sans-serif">结算服务</text><text x="760.5" y="935.5" text-anchor="middle" font-size="15" font-family="Microsoft YaHei, sans-serif"></text><rect x="965" y="70" width="210" height="55" rx="0" fill="#f1f5f9" stroke="#334155" stroke-width="1.4"/><text x="1070.0" y="102.5" text-anchor="middle" font-size="16" font-family="Microsoft YaHei, sans-serif">业务存储</text><text x="1070.5" y="935.5" text-anchor="middle" font-size="15" font-family="Microsoft YaHei, sans-serif"></text><text x="640.0" y="987.0" text-anchor="middle" font-size="15" font-family="Microsoft YaHei, sans-seri