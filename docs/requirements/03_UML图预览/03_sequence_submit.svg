<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="1050" viewBox="0 0 1260 1050"><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#334155" stroke-width="1.4"/></marker><marker id="tri" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M1 1L11 6L1 11Z" fill="white" stroke="#334155"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="32" y="35" font-size="23" font-weight="bold" font-family="Microsoft YaHei, sans-serif">顺序图 提交预约</text><rect x="35" y="70" width="210" height="55" rx="0" fill="#f1f5f9" stroke="#334155" stroke-width="1.4"/><text x="140.0" y="102.5" text-anchor="middle" font-size="16" font-family="Microsoft YaHei, sans-serif">宠物主人</text><text x="140.5" y="935.5" text-anchor="middle" font-size="15" font-family="Microsoft YaHei, sans-serif"></text><rect x="345" y="70" width="210" height="55" rx="0" fill="#f1f5f9" stroke="#334155" stroke-width="1.4"/><text x="450.0" y="102.5" text-anchor="middle" font-size="16" font-family="Microsoft YaHei, sans-serif">预约页面</text><text x="450.5" y="935.5" text-anchor="middle" font-size="15" font-family="Microsoft YaHei, sans-serif"></text><rect x="655" y="70" width="210" height="55" rx="0" fill="#f1f5f9" stroke="#334155" stroke-width="1.4"/><text x="760.0" y="102.5" text-anchor="middle" font-size="16" font-family="Microsoft YaHei, sans-serif">预约服务</text><text x="760.5" y="935.5" text-anchor="middle" font-size="15" font-family="Microsoft YaHei, sans-serif"></text><rect x="965" y="70" width="210" height="55" rx="0" fill="#f1f5f9" stroke="#334155" stroke-width="1.4"/><text x="1070.0" y="102.5" text-anchor="middle" font-size="16" font-family="Microsoft YaHei, sans-serif">业务存储</text><text x="1070.5" y="935.5" text-anchor="middle" font-size="15" font-family="Microsoft YaHei, sans-serif"></text><text x="640.0" y="987.0" text-anchor="middle" font-size="15" font-family="Microsoft YaHei, sans-serif">异常：参数或归属错误时不创建；重复 requestId 返回原结果。</text><text x="640.0" y="1008.0" text-anchor="middle" font-size="15" font-family="Microsoft YaHei, sans-serif">待审核不占房，查询余量只是参考，审核阶段重新检查。</text><polyline points="140,125 140,930" fill="none" stroke="#334155" stroke-width="1.35" stroke-dasharray="6 5" /><polyline points="450,125 450,930" fill="none" stroke="#334155" stroke-width="1.35" stroke-dasharray="6 5" /><polyline points="760,125 760,930" fill="none" stroke="#334155" stroke-width="1.35" stroke-dasharray="6 5" /><polyline points="1070,125 1070,930" fill="none" stroke="#334155" stroke-width="1.35" stroke-dasharray="6 5" /><polyline points="140,170 450,170" fill="none" stroke="#334155" stroke-width="1.35"  marker-end="url(#arr)"/><rect x="236.5" y="151.0" width="117" height="19" fill="white"/><text x="295.0" y="166.0" text-anchor="middle" font-size="13" font-family="Microsoft YaHei, sans-serif">1 填写宠物和日期</text><polyline points="450,231 760,231" fill="none" stroke="#334155" stroke-width="1.35"  marker-end="url(#arr)"/><rect x="501.0" y="212.0" width="208" height="19" fill="white"/><text x="605.0" y="227.0" text-anchor="middle" font-size="13" font-family="Microsoft YaHei, sans-serif">2 提交预约 requestId</text><polyline points="760,292 1070,292" fill="none" stroke="#334155" stroke-width="1.35"  marker-end="url(#arr)"/><rect x="843.5" y="273.0" width="143" height="19" fill="white"/><text x="915.0" y="288.0" text-anchor="middle" font-size="13" font-family="Microsoft YaHei, sans-serif">3 检查请求标识和归属</text><polyline points="1070,353 760,353" fill="none" stroke="#334155" stroke-width="1.35" stroke-dasharray="6 5" marker-end="url(#arr)"/><rect x="830.5" y="334.0" width="169" height="19" fill="white"/><text x="915.0" y="349.0" text-anchor="middle" font-size="13" font-family="Microsoft YaHei, sans-serif">4 返回既有结果或宠物资料</text><polyline points="760,414 1070,414" fill="none" stroke="#334155" stroke-width="1.35"  marker-end="url(#arr)"/><rect x="830.5" y="395.0" width="169" height="19" fill="white"